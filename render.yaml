services:
  - type: web
    name: travel-guide
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
